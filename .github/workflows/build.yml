name: build
on: [push]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: ['11', '17', '21', '25']
        include:
          - os: windows-latest
            java: '17'
          - os: macos-latest
            java: '17'
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: ${{ matrix.java }}
      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify
