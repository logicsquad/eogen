name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify
